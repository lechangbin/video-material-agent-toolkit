[project]
name = "video-material-collector"
version = "0.3.0"
description = "Agent-oriented CLI for discovering and downloading short-video source material."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiosqlite>=0.22,<1",
    "httpcore>=1.0,<2",
    "httpx[socks]>=0.28,<1",
    "playwright>=1.61,<2",
    "pydantic>=2.13,<3",
    "sqlalchemy>=2.0,<3",
    "typer>=0.27,<1",
]

[project.scripts]
material-collector = "material_collector.adapters.cli.app:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/material_collector"]
