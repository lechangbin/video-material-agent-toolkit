[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semvideo"
version = "0.1.3"
description = "Agent-first local video understanding and semantic segmentation CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.6,<3.15"
dependencies = [
  "faster-whisper==1.2.1",
  "httpx>=0.28,<0.29",
  "pillow>=12.3,<13",
  "pydantic>=2.12,<3",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]
prototype = [
  "claude-real-video[fast]==0.7.16",
]

[project.scripts]
semvideo = "semvideo.cli:main"
semvideo-prototype = "semvideo_prototype.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["semvideo*", "semvideo_prototype*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
