name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install uv
      - name: Test material-collector
        shell: pwsh
        run: |
          Set-Location packages/material-collector
          uv sync
          uv run pytest
          uv run ruff check .
          uv run mypy .
      - name: Test Semvideo
        shell: pwsh
        run: |
          Set-Location packages/semvideo
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Test media-conformance
        shell: pwsh
        run: |
          Set-Location packages/media-conformance
          uv sync
          uv run pytest
          uv run ruff check .
          uv run mypy src
      - name: Build release artifacts
        shell: pwsh
        run: .\scripts\build-release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: video-material-agent-toolkit-wheels
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build toolkit image
        run: docker build --tag video-material-agent-toolkit:test .
      - name: Smoke-test all CLIs
        run: |
          docker run --rm video-material-agent-toolkit:test material-collector --help
          docker run --rm video-material-agent-toolkit:test semvideo --version --json
          docker run --rm video-material-agent-toolkit:test media-conformance --help
