name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install uv
      - name: Test material-collector
        shell: pwsh
        run: |
          Set-Location packages/material-collector
          uv sync
          uv run pytest
          uv run ruff check .
          uv run mypy .
      - name: Test Semvideo
        shell: pwsh
        run: |
          Set-Location packages/semvideo
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build release artifacts
        shell: pwsh
        run: .\scripts\build-release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: video-material-agent-toolkit-wheels
          path: dist/*
